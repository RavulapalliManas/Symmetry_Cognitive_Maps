      split: fixed_trajectory_families_with_twins_and_queries_kept_together
      replicate_unit: independently_initialized_network_in_scientific_pilot_not_frames
      selection_rule: all_declared_development_arms_reported_no_endpoint_selection
      failure_interpretation: encoder_effect_is_not_evidence_of_a_V1_mechanism_or_retention_change
