schema_version: 1
scope: reference_pipeline_and_bounded_X1_development
campaign_authorized: false
scientific_runs_launched: false
training_runner_implemented: true
training_runner_scope: bounded_forced_route_CPU_development_not_a_scientific_campaign
proposed_resource_limits:
  max_memory_gib_per_process: 2
  cpu_threads_per_process: 2
  concurrent_jobs: 1
  approved_gpu_hours: null
  approved_monetary_budget: null
  artifact_root: null
  durable_archive: null
requirements:
  - id: legacy_assets
    stage: M0
    owner: user_and_implementer
    needed: Reconcile the manuscript fingerprint; selected checkpoints and trajectory stores are located on cpu-angad.
    status: assets_located_manuscript_pending
  - id: legacy_revision
    stage: M0
    owner: implementer
    needed: Pin checkpoint-compatible source and record dirty-source differences and tested heading aliases.
    status: unresolved
  - id: vertical_slice
    stage: M0-M1
    owner: implementer
    needed: Implement and verify the real legacy replay, observer, split isolation, recording, and source-linked analysis.
    status: reference_slice_implemented_campaign_diagnostics_pending
  - id: pilot_protocol
    stage: M2
    owner: user_and_implementer
    needed: Define cue timing, layout, training delay distribution, rewards, optimizer schedule, split manifests, and stopping budgets.
    status: development_protocol_defined_scientific_protocol_not_frozen
  - id: pilot_implementation
    stage: M2
    owner: implementer
    needed: Implement and test transient-cue tasks, loss routing, decision timing, recurrent replay, and exact continuation.
    status: bounded_development_verified_campaign_pending
  - id: compute_and_storage
    stage: before_any_scientific_launch
    owner: user
    needed: Approve target hardware, hard compute limits, output location, durable archive, and the frozen campaign after profiling.
    status: not_authorized

implementation:
  legacy_reference:
    status: executed
    config: configs/protocols/X0_replay.yaml
    output: cpu-angad:~/symm/results/map_dynamics/x0/reference_01
    verified: [native_state_equivalence, source_fingerprint, exact_C2_inputs, sparse_observer, split_isolation, diagnostic_readouts]
    pending: [manuscript_reconciliation, legacy_alias_reconciliation, original_optimizer_continuation, cloud_archive]
  X1:
    status: bounded_development_verified_campaign_pending
    config: configs/protocols/X1_development.yaml
    implementation: [src/map_dynamics/transient.py, src/map_dynamics/learning.py]
    scope: CPU_software_development_no_scientific_hypothesis_test
    software_verification:
      date: '2026-10-16'
      command: MAP_DYNAMICS_LEGACY_ROOT=legacy_reference uv run --locked --extra science pytest -q tests
      result: {passed: 41, exit_code: 0, warnings: 1}
      warning: inherited_legacy_TorchScript_deprecation
      log: cpu-angad:~/symm/results/map_dynamics/x1_development_20261016/tests_reviewed.log
      verified: [paired_input_identity, domain_restriction, single_cue_posterior, final_feedback_timing, gradient_routing, native_prediction_equivalence, prediction_state_isolation, exact_optimizer_and_RNG_continuation, evaluation_RNG_isolation, protocol_mismatch_rejection]
    development_run:
      command: uv run --locked --extra science map-dynamics --root . develop-x1 --config configs/protocols/X1_development.yaml --output NEW_FLEET_DIRECTORY
      result: {status: complete_development_run, exit_code: 0}
      output: cpu-angad:~/symm/results/map_dynamics/x1_development_20261016/smoke_reviewed
      log: cpu-angad:~/symm/results/map_dynamics/x1_development_20261016/smoke_reviewed.log
      boundary: verifies_execution_and_artifact_production_not_learning_quality_or_hypotheses
    preparation_check: {status: preparation_consistent, launchable: false, exit_code: 0}
    independent_review:
      status: completed_finding_addressed_by_regression
      finding: effective_legacy_input_projection_flag_missing_from_checkpoint_contract
      correction: record_effective_flag_and_reject_changed_execution_path_on_resume
      regression: test_resume_rejects_changed_legacy_gradient_execution_path
    decision_record:
      date: '2026-10-16'
      rationale: Establish one complete forced-route task before active checking or architecture expansion.
      affected_experiments: [X1]
      observation_change: Reserve_first_two_RGB_pixels_for_context_cue_and_final_query_in_every_frame
      task_rules: shared_reports_query_context_specific_reports_query_XOR_context
      rewards: {correct: 1, incorrect: 0, before_commitment: 0}
      delay_unit: transitions_since_last_cue_frame
      cue_noise: one_binary_draw_repeated_for_cue_duration
      spatial_scope: fixed_start_and_twin_with_routes_restricted_to_corresponding_domains
      learning: legacy_pRNN_cell_and_rollout_new_arrival_inputs_Adam_no_dropout_full_episode_PPO_replay
      task_gradients: final_agent_selected_response_only_no_actor_loss_on_forced_movement
      prediction: legacy_branch_does_not_mutate_live_population
      migration: no_legacy_source_or_checkpoint_semantics_changed
      sources:
        checkpoint_state: https://docs.pytorch.org/tutorials/beginner/saving_loading_models.html
        environment_timing: https://gymnasium.farama.org/api/env/
        recurrent_PPO: https://iclr-blog-track.github.io/2022/03/25/ppo-implementation-details/
      verification: tests/test_x1.py
    pending: [full_scale_training_runner, room_report_capacity_control, fixed_readout_transfer, campaign_protocol_and_budget, independent_layouts, durable_archive]
    verification_attempts:
      - log: cpu-angad:~/symm/results/map_dynamics/x1_development_20261016/tests_before.log
        result: expected_failure_missing_transient_and_learning_modules_exit_1
      - log: cpu-angad:~/symm/results/map_dynamics/x1_development_20261016/tests_contract_before.log
        result: expected_failures_final_action_counter_invalid_settings_and_resume_protocol_exit_1
      - log: cpu-angad:~/symm/results/map_dynamics/x1_development_20261016/review_before.log
        result: expected_failure_resume_accepted_changed_legacy_execution_flag_exit_1
  X2_to_X5:
    status: preparation_only

research_review:
  date: '2026-10-16'
  status: completed_metadata_review
  mode: exploratory_literature_and_dataset_review
  requested_model: gpt-6-luna
  scope: biological_datasets_novelty_learning_algorithms_and_optimality
  outputs: ranked_datasets_prior_art_and_falsifiable_research_options
  source_strategy: primary_papers_and_actual_dataset_or_author_code_repositories
  acceptance: distinguish_verified_access_from_reported_access_and_proposals_from_results
  scientific_hypotheses_promoted: false
  downloads_or_experiments_authorized_by_review: false
  workstreams:
    rodent_datasets: {owner: rodent_datasets, status: reviewed}
    insect_fish_datasets: {owner: insect_fish_datasets, status: reviewed}
    behavior_multisensory_datasets: {owner: behavior_multisensory_datasets, status: reviewed}
    novelty: {owner: novelty_review, status: reviewed}
    learning_algorithms: {owner: learning_algorithms_review, status: reviewed}
    optimality: {owner: optimality_review, status: reviewed}
  verification_boundary:
    - Primary papers, repository descriptions, and public file listings were inspected.
    - No raw file was downloaded, parsed, counted, or analyzed.
    - Public listing does not establish complete stimulus reconstruction or synchronized coverage.
    - Dataset licenses require record-specific review before reuse.
  verification_attempts:
    - check: remote_metadata_and_preparation
      result: failed_exit_1
      signal: KeyError_research_review
      cause: relative_copy_wrote_nested_directory_instead_of_canonical_registry
      correction: copy_to_explicit_remote_filenames_and_repeat_unchanged_check
