  recommended_empirical_anchors:
    longitudinal_neural_learning: sun_2acdc
    cross_species_behavior: de_cothi_cross_species
    nonvisual_memory: dorian_odor_delay
    delivered_cue_updates: prince_cue_update
    additional_organisms: [torigoe_avoidance, currier_airflow]
  empirical_admission_requirements:
    - Inspect a bounded metadata and processed-trace subset before choosing analyses or download budgets.
    - Verify trial timing, subject identifiers, cell registration, and neural-behavior synchronization in files.
    - Reconstruct the animal's permitted evidence; label missing sensory streams as unknown rather than blocked.
    - Separate learning across sessions from within-trial state changes and acute perturbation responses.
    - Define an observation model before comparing artificial activity with calcium, spikes, or EEG.
    - Match tasks and observables before interpreting differences between organisms.
  prior_art:
    sun_2025:
      source: https://doi.org/10.1038/s41586-024-08548-w
      overlap: longitudinal_map_learning_and_CSCG_RNN_LSTM_Transformer_comparisons
      verification: parent_read_primary_article_methods_and_data_statement
      consequence: architecture_comparison_and_map_development_alone_do_not_establish_novelty
    low_2023:
      source: https://elifesciences.org/articles/86943
      code: https://github.com/ahwillia/rnn_remapping_paper
      overlap: recurrent_navigation_context_inference_and_aligned_remapping
      verification: subagent_primary_review_parent_checked_author_repository
    cone_clopath_2024:
      source: https://doi.org/10.1038/s41467-024-44871-6
      code: https://github.com/ianconehed/latent_reps_hpc
      overlap: task_relevant_representation_and_behavior_codevelopment_with_plateau_learning
      verification: subagent_primary_review
    tem_2020:
      source: https://pmc.ncbi.nlm.nih.gov/articles/PMC7707106/
      code: https://github.com/djcrw/generalising-structural-knowledge
      overlap: reusable_relational_structure_sensory_grounding_and_transfer
      verification: subagent_primary_review
    predictive_map_2017:
      source: https://doi.org/10.1038/nn.4650
      overlap: policy_dependent_predictive_spatial_representations
      verification: subagent_primary_review
    cscg_active_inference_2023:
      source: https://arxiv.org/abs/2308.08307
      publication_type: preprint
      overlap: map_learning_information_seeking_and_planning_under_ambiguity
      verification: parent_checked_primary_abstract
    de_cothi_2022:
      dataset_reference: de_cothi_cross_species
      overlap: homologous_rat_human_navigation_and_RL_agent_comparison
      verification: parent_checked_primary_paper_data_statement_and_repository
    kim_2026:
      source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13232270/
      doi: '10.64898/2026.02.07.704615'
      publication_type: preprint_not_peer_reviewed
      overlap: developmental_geometry_and_dynamics_reanalysis_of_Sun_dataset
      verification: subagent_read_primary_text_parent_fetch_blocked
      code_access: subagent_reports_release_planned_after_acceptance_not_parent_verified
  novelty_assessment:
    exhaustive_search: false
    novelty_established: false
    candidates:
      information_retention_and_use:
        question: Can separate information, memory, and policy failures predict held-out perturbation responses?
        design: matched_inputs_fixed_and_refitted_readouts_targeted_and_matched_control_perturbations
        failure_interpretation: equivalent_simple_decay_predictions_or_general_disruption_weaken_mechanism_specific_claims
      memory_and_checking:
        question: How do randomized cue access and checking costs alter persistent memory and later learning?
        design: randomized_costs_standardized_retention_and_controlled_future_evidence
        failure_interpretation: better_behavior_without_retention_change_supports_compensation_rather_than_stronger_memory
      prospective_transfer:
        question: Do pre-transfer population measurements predict adaptation cost beyond simple task descriptors?
        design: freeze_predictor_before_held_out_layouts_and_compare_simple_baselines
        failure_interpretation: no_incremental_prediction_limits_the_generalization_claim
  learning_comparisons:
    status: proposed_not_implemented
    source_links:
      uoro: https://arxiv.org/abs/1702.05043
      uoro_implementation_example: https://github.com/petered/uoro-demo
      rflo: https://elifesciences.org/articles/43299
      rflo_author_code: https://github.com/murray-lab/rflo-learning
      eprop: https://doi.org/10.1038/s41467-020-17236-y
      eprop_author_code: https://github.com/IGITUGraz/eligibility_propagation
      reward_modulated_learning: https://elifesciences.org/articles/20899
      btsp: https://doi.org/10.1126/science.aan3846
      cscg: https://doi.org/10.1038/s41467-021-22559-5
      cscg_author_code: https://github.com/vicariousinc/naturecomm_cscg
      transformer: https://arxiv.org/abs/1706.03762
      mamba: https://arxiv.org/abs/2312.00752
    source_verification:
      parent_checked: [uoro, uoro_implementation_example, rflo_author_code, eprop_author_code, cscg_author_code]
      remaining_papers: subagent_primary_review_not_independently_executed_or_reproduced
    ordered_comparisons:
      - Keep the legacy cell and objective fixed while changing temporal credit windows on bounded episodes.
      - Choose windows relative to cue-to-feedback delay; identical effective windows cannot test credit assignment.
      - Consider UORO as a general online gradient estimator; measure estimator variance and computation.
      - Use CSCG as a learned latent-state model distinct from the known-model Bayes observer.
      - Compare pRNN, GRU or LSTM, causal Transformer, and Mamba under matched declared input histories and objectives.
      - Treat RFLO, e-prop, reward-modulated, or plateau plasticity as mechanism-specific extensions with explicit cell assumptions.
    compatibility_boundary:
      source: legacy_reference/utils/thetaRNN.py
      cell: LayerNormRNNCellEager
      finding: hidden_wide_normalization_couples_units_and_requires_explicit_derivation_for_local_plasticity
      verification: parent_and_learning_algorithms_agent_read_cell_source
      consequence: changing_normalization_or_cell_together_with_rule_is_not_an_isolated_rule_comparison
    controls:
      - Distinguish objective, gradient estimator or plasticity rule, optimizer, inference procedure, and architecture.
      - Count all persistent memory, including LSTM cell states, Transformer caches, and Mamba state or buffers.
      - Match experience and report parameter, memory, update, and measured compute budgets separately.
      - Use development data for tuning and held-out routes or layouts for comparison.
      - Retain nonconvergence and compare both matched experience and matched competence where attainable.
  optimality:
    status: proposed_benchmarks_not_computed
    sources:
      finite_horizon_pomdp: https://doi.org/10.1287/opre.21.5.1071
      solver_reference: https://www.pomdp.org/code/
      rate_distortion: https://doi.org/10.1016/j.cognition.2016.03.020
      resource_rationality: https://doi.org/10.1017/S0140525X1900061X
      biological_energy: https://doi.org/10.1038/236
    definitions:
      inference: Bayes_context_loss_given_the_exact_permitted_history_and_generative_model
      control: expected_total_reward_with_declared_horizon_travel_and_sensing_costs
      memory: best_value_within_a_declared_memory_or_information_constraint
      learning: task_performance_as_a_function_of_separate_interaction_update_and_compute_budgets
      biological_energy: requires_calibrated_biological_costs_not_weight_norm_or_prediction_accuracy
    recommended_first_benchmark: small_finite_cue_delay_choice_task_with_optional_costly_sensing
    exactness_boundary: exact_filter_and_finite_horizon_control_for_small_known_models_approximate_bounds_or_explicit_controller_classes_at_scale
    distinctions:
      - Bayes classification accuracy is not reward-optimal navigation or checking.
      - Memory-state dimension is not automatically a mutual-information budget.
      - A known-model oracle and a learned model have different prior knowledge; report both.
      - A better policy under the same model, objective, evidence, and cost refutes the claimed policy optimum.
      - Do not retune a resource-cost model after observing the final organism or layout results.
  next_actions:
    - Select a bounded Sun processed-data subset and the de Cothi behavioral release for metadata-level task reconstruction.
    - Amend the mutable protocol with explicit observations, reward, sensing costs, and memory budgets before implementation.
    - Build the common finite task and learner, then run controlled comparisons and prospective tests.
    - Keep additional organisms and local plasticity as question-driven extensions rather than a full Cartesian campaign.
